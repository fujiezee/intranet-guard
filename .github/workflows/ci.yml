name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 单元测试（SQLite / PostgreSQL / ClickHouse）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: safe
          POSTGRES_PASSWORD: safe
          POSTGRES_DB: safe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safe" --health-interval 5s --health-timeout 5s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: safe
          CLICKHOUSE_PASSWORD: safe
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10" # 与 go.mod 的 toolchain 一致；低于此版本的标准库有已知漏洞
      - name: 没有源码被 .gitignore 忽略
        run: |
          ignored=$(git ls-files --others --ignored --exclude-standard -- '*.go' '*.vue' '*.js' '*.sh' '*.tmpl' | grep -v '^web/node_modules/' || true)
          if [ -n "$ignored" ]; then echo "被忽略的源码文件："; echo "$ignored"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: 测试（SQLite）
        run: go test -race -count=1 ./...
      - name: 测试（PostgreSQL）
        run: go test -count=1 ./...
        env:
          SAFE_TEST_PG_DSN: postgres://safe:safe@127.0.0.1:5432/safe_test?sslmode=disable
      - name: 测试（PostgreSQL + ClickHouse）
        run: go test -count=1 ./...
        env:
          SAFE_TEST_PG_DSN: postgres://safe:safe@127.0.0.1:5432/safe_test?sslmode=disable
          SAFE_TEST_CH_URL: clickhouse://safe:safe@127.0.0.1:8123
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check:guide
        working-directory: web
      - run: npm run check:i18n
        working-directory: web
      - run: npm run check:refs
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  install:
    name: 一键安装端到端（真实 Ubuntu + systemd）
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10" # 与 go.mod 的 toolchain 一致；低于此版本的标准库有已知漏洞
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 生成测试用的发布密钥（只用于本次 CI，正式私钥不进入 CI）
        run: |
          go run ./cmd/sign keygen "$RUNNER_TEMP/release-key"
          echo "SAFE_SIGN_KEY=$RUNNER_TEMP/release-key/release.key" >> "$GITHUB_ENV"
          echo "RELEASE_PUBKEY=$(cat "$RUNNER_TEMP/release-key/release.pub")" >> "$GITHUB_ENV"
      - name: 生成安装包
        run: make release VERSION=ci
      - name: 在线升级测试用的 Agent 版本（新版本、启动即退出的坏版本）
        run: |
          mkdir -p dist/upgrade
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X safe/internal/agent.Version=ci-next -X safe/internal/agent.ReleaseKeys=$RELEASE_PUBKEY" -o dist/upgrade/safe-agent-next ./cmd/agent
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X safe/internal/agent.Version=ci-broken -X safe/internal/agent.ReleaseKeys=$RELEASE_PUBKEY -X main.testCrashOnStart=1" -o dist/upgrade/safe-agent-broken ./cmd/agent
          go run ./cmd/sign sign -key "$SAFE_SIGN_KEY" -pub "$RELEASE_PUBKEY" -version ci-next -name safe-agent-linux-amd64 dist/upgrade/safe-agent-next
          go run ./cmd/sign sign -key "$SAFE_SIGN_KEY" -pub "$RELEASE_PUBKEY" -version ci-broken -name safe-agent-linux-amd64 dist/upgrade/safe-agent-broken
      - name: 安装模拟测试（替身命令）
        run: scripts/test-install.sh
      - name: 真实安装 → 注册 → 扫描 → 蜜罐 → 攻击模拟 → 升级 → 卸载
        run: sudo scripts/e2e-linux.sh dist/safe-ci-linux-amd64.tar.gz dist/upgrade
      - name: 失败时的服务日志
        if: failure()
        run: sudo journalctl -u 'safe-*' -n 200 --no-pager || true

  ha:
    name: 规模与高可用（1 万 Agent，两个实例，切换演练）
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: safe
          POSTGRES_PASSWORD: safe
          POSTGRES_DB: safe_ha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safe" --health-interval 5s --health-timeout 5s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: safe
          CLICKHOUSE_PASSWORD: safe
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: 构建
        run: |
          mkdir -p bin
          go build -o bin/safe-server ./cmd/server
          go build -o bin/safe-loadtest ./cmd/loadtest
      - name: 1 万 Agent 压测，中途强制杀掉一个实例
        run: |
          ulimit -n 65536
          scripts/e2e-ha.sh bin 'postgres://safe:safe@127.0.0.1:5432/safe_ha?sslmode=disable' 'clickhouse://safe:safe@127.0.0.1:8123/safe_ha'

  k8s:
    name: Kubernetes 端到端（真实 k3s 集群）
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 生成测试用的发布密钥（只用于本次 CI，正式私钥不进入 CI）
        run: |
          go run ./cmd/sign keygen "$RUNNER_TEMP/release-key"
          echo "SAFE_SIGN_KEY=$RUNNER_TEMP/release-key/release.key" >> "$GITHUB_ENV"
          echo "RELEASE_PUBKEY=$(cat "$RUNNER_TEMP/release-key/release.pub")" >> "$GITHUB_ENV"
      - name: 生成安装包
        run: make release VERSION=ci
      - name: 在线升级测试用的 Agent 版本（新版本、启动即退出的坏版本）
        run: |
          mkdir -p dist/upgrade
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X safe/internal/agent.Version=ci-next -X safe/internal/agent.ReleaseKeys=$RELEASE_PUBKEY" -o dist/upgrade/safe-agent-next ./cmd/agent
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X safe/internal/agent.Version=ci-broken -X safe/internal/agent.ReleaseKeys=$RELEASE_PUBKEY -X main.testCrashOnStart=1" -o dist/upgrade/safe-agent-broken ./cmd/agent
          go run ./cmd/sign sign -key "$SAFE_SIGN_KEY" -pub "$RELEASE_PUBKEY" -version ci-next -name safe-agent-linux-amd64 dist/upgrade/safe-agent-next
          go run ./cmd/sign sign -key "$SAFE_SIGN_KEY" -pub "$RELEASE_PUBKEY" -version ci-broken -name safe-agent-linux-amd64 dist/upgrade/safe-agent-broken
      - name: 管理中心 → k3s → DaemonSet 部署 Agent → Pod 内攻击 → 自检 → 重建 → 卸载
        run: sudo scripts/e2e-k8s.sh dist/safe-ci-linux-amd64.tar.gz dist/upgrade
      - name: 失败时的日志
        if: failure()
        run: |
          sudo journalctl -u safe-server -n 100 --no-pager || true
          sudo k3s kubectl -n safe-system get pods -o wide || true
          sudo k3s kubectl -n safe-system logs -l app=safe-agent --all-containers --tail=100 || true

  windows:
    name: Windows Agent 端到端（真实 Windows Server）
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Agent 单元测试（含事件日志 API、结束进程等真实系统调用）
        run: go test -count=1 ./internal/agent/... ./cmd/agent/...
      - name: 构建管理中心与 Windows Agent
        shell: bash
        run: |
          mkdir -p e2e/downloads
          CGO_ENABLED=0 go build -o e2e/safe-server.exe ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o e2e/downloads/safe-agent-windows-amd64.exe ./cmd/agent
      - name: 一行命令安装 → 真实安全事件 → 告警 → 自检 → 处置 → 升级 → 卸载
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\e2e-windows.ps1 -Dir e2e
      - name: 失败时的日志
        if: failure()
        shell: powershell
        run: |
          Write-Host '--- server.log'; Get-Content e2e\server.log -Tail 150 -ErrorAction SilentlyContinue
          Write-Host '--- agent.log'; Get-Content C:\ProgramData\safe-agent\agent.log -Tail 150 -ErrorAction SilentlyContinue
