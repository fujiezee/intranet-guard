# One-time enrollment token. Create it in the console:
#   Node management -> generate registration token -> kind "agent",
#   max uses >= number of nodes. Copy the token string here.
# After every node is enrolled this Secret can be deleted; the agent keeps its
# certificate on the node's hostPath and no longer reads the token.
#
# Do not commit a real token. Prefer:
#   kubectl -n safe-system create secret generic safe-agent-enroll \
#     --from-literal=token='<TOKEN>'
apiVersion: v1
kind: Secret
metadata:
  name: safe-agent-enroll
  namespace: safe-system
type: Opaque
stringData:
  token: REPLACE_WITH_ENROLLMENT_TOKEN
