# safe-agent on every Kubernetes node.
#
# Before applying:
#   1. Build and push the image, set it below (REPLACE_IMAGE).
#   2. Set -server to your management center node endpoint(s).
#   3. Create the enrollment token Secret (see deploy/k8s/enroll-secret.example.yaml);
#      the token must allow at least as many uses as you have nodes.
#
# The agent needs host PID and root to read other pods' /proc and /etc/shadow
# and to run response actions. It maps processes to Pods via /var/log/pods and
# watches node host files for integrity changes via the read-only mounts below.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: safe-agent
  namespace: safe-system
  labels:
    app: safe-agent
spec:
  selector:
    matchLabels:
      app: safe-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: safe-agent
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Run on every node, including tainted control-plane nodes.
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 20
      containers:
        - name: safe-agent
          image: REPLACE_IMAGE # e.g. registry.internal/safe-agent:0.1.0
          args:
            - -server=https://47.117.27.183:8443
            - -id=$(NODE_NAME)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SAFE_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: safe-agent-enroll
                  key: token
                  optional: true # only needed until the node is enrolled
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/safe-agent
            - name: pods-log
              mountPath: /var/log/pods
              readOnly: true
            - name: host-etc
              mountPath: /etc
              readOnly: true
            - name: host-root-home
              mountPath: /root
              readOnly: true
            - name: host-home
              mountPath: /home
              readOnly: true
            - name: host-cron
              mountPath: /var/spool/cron
              readOnly: true
      volumes:
        - name: state
          hostPath:
            path: /var/lib/safe-agent
            type: DirectoryOrCreate
        - name: pods-log
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
        - name: host-root-home
          hostPath:
            path: /root
            type: DirectoryOrCreate
        - name: host-home
          hostPath:
            path: /home
            type: DirectoryOrCreate
        - name: host-cron
          hostPath:
            path: /var/spool/cron
            type: DirectoryOrCreate
