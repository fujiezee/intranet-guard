# 控制台 HTTPS 反向代理示例。管理中心以 -addr 127.0.0.1:8080 -trusted-proxies 127.0.0.1/32 运行。
# 注意：节点接入端口 8443 是 mTLS，探针 / Agent 直接连接管理中心，不要经过这个代理。
server {
    listen 443 ssl;
    http2 on;
    server_name safe.example.internal;            # 改为控制台域名

    ssl_certificate     /etc/nginx/ssl/safe.crt;  # 公司证书
    ssl_certificate_key /etc/nginx/ssl/safe.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # 用 $remote_addr 覆盖而不是追加，客户端自带的 X-Forwarded-For 不会被采信
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name safe.example.internal;
    return 301 https://$host$request_uri;
}
